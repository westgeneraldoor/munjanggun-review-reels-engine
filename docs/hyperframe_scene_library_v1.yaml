# Hyperframe Scene Library v1.0
# v1.2 Rulebook 호환 — 100개 씬 전체 메타데이터 + 시퀀스 정의
# 사용법: scene_id 또는 scene name으로 호출, Master Prompt Input에 scene_list로 주입

scenes:

  # ============================================================
  # A. HOOK — 첫 3초 장악 (1~20)
  # ============================================================

  - id: A01
    name: hero_reveal
    best_for: [saas, luxury_hardware, startup_hype]
    arc_step: hook
    emotion: [premium, urgency]
    duration: [4.0, 6.0]
    energy: high
    camera_move: dolly_in
    color_scheme: premium
    transition_in: fade
    transition_out: zoom_through
    conversion_score: 9.4
    sequence:
      - step: bg_fade_in
        target: ".bg-layer"
        props: { autoAlpha: "0->1" }
        duration: 0.8
        ease: soft_entry
      - step: product_scale
        target: ".product-hero"
        props: { scale: "0.92->1.00", autoAlpha: "0->1" }
        duration: 1.0
        ease: premium_out
        offset: "-=0.3"
      - step: headline_chars_stagger
        target: ".hero-title span"
        props: { yPercent: "120->0", scale: "1.2->1.0", autoAlpha: "0->1" }
        duration: 0.9
        stagger: chars
        ease: premium_out
        offset: "-=0.2"
      - step: lighting_apply
        target: ".product-hero"
        lighting: rim_glow
        offset: "-=0.5"
      - step: dwell
        duration: 1.6
        secondary_action: true

  - id: A02
    name: punch_headline
    best_for: [saas, startup_hype]
    arc_step: hook
    emotion: [urgency, premium]
    duration: [1.0, 2.0]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: hard_cut
    transition_out: hard_cut
    conversion_score: 8.8
    sequence:
      - step: scale_punch_drop
        target: ".punch-word"
        props: { scale: "1.18->1.0", autoAlpha: "0->1" }
        duration: 0.6
        ease: premium_out
      - step: dwell
        duration: 0.9
        secondary_action: false

  - id: A03
    name: rapid_problem_cut
    best_for: [startup_hype]
    arc_step: hook
    emotion: [urgency]
    duration: [0.3, 0.6]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: hard_cut
    transition_out: hard_cut
    conversion_score: 8.2
    sequence:
      - step: flash_in
        target: ".problem-screen"
        props: { autoAlpha: "0->1->0" }
        duration: 0.35
        ease: sharp_exit

  - id: A04
    name: blackout_flash
    best_for: [startup_hype, luxury_hardware]
    arc_step: hook
    emotion: [urgency, premium]
    duration: [1.0, 2.0]
    energy: high
    camera_move: null
    color_scheme: luxury
    transition_in: hard_cut
    transition_out: directional_wipe
    conversion_score: 8.5
    sequence:
      - step: blackout
        target: ".scene-root"
        props: { backgroundColor: "#000000", autoAlpha: "1" }
        duration: 0.18
        ease: sharp_exit
      - step: flash_reveal
        target: ".hero-element"
        props: { autoAlpha: "0->1", scale: "1.05->1.0" }
        duration: 0.5
        ease: premium_out
        offset: "+=0.1"
      - step: dwell
        duration: 1.0

  - id: A05
    name: zoom_from_void
    best_for: [saas, luxury_hardware]
    arc_step: hook
    emotion: [innovation, premium]
    duration: [2.0, 3.5]
    energy: high
    camera_move: dolly_in
    color_scheme: innovation
    transition_in: fade
    transition_out: zoom_through
    conversion_score: 9.0
    sequence:
      - step: void_hold
        target: ".bg-layer"
        props: { backgroundColor: "#000000" }
        duration: 0.5
      - step: zoom_in
        target: ".hero-element"
        props: { scale: "0.1->1.0", autoAlpha: "0->1" }
        duration: 1.2
        ease: zoom_scale
        offset: "-=0.2"
      - step: headline_chars_stagger
        target: ".hero-title span"
        props: { yPercent: "120->0", autoAlpha: "0->1" }
        duration: 0.9
        stagger: chars
        ease: premium_out
        offset: "-=0.3"

  - id: A06
    name: stat_shock
    best_for: [saas, startup_hype]
    arc_step: hook
    emotion: [urgency, trust]
    duration: [2.0, 3.5]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: hard_cut
    transition_out: directional_wipe
    conversion_score: 9.2
    sequence:
      - step: stat_label
        target: ".stat-label"
        props: { yPercent: "120->0", autoAlpha: "0->1" }
        duration: 0.5
        ease: premium_out
      - step: KPI_counter
        target: ".stat-number"
        props: { innerText: "0->target_value" }
        duration: 1.5
        ease: number_roll
        offset: "-=0.2"
      - step: dwell
        duration: 0.8

  - id: A07
    name: bold_word_swap
    best_for: [saas, startup_hype]
    arc_step: hook
    emotion: [urgency, innovation]
    duration: [2.0, 4.0]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: hard_cut
    transition_out: hard_cut
    conversion_score: 8.7
    sequence:
      - step: word_out
        target: ".word-current"
        props: { yPercent: "0->-120", autoAlpha: "1->0" }
        duration: 0.3
        ease: power2_in
      - step: word_in
        target: ".word-next"
        props: { yPercent: "120->0", autoAlpha: "0->1" }
        duration: 0.3
        ease: premium_out
        offset: "-=0.15"
      - step: dwell
        duration: 0.9

  - id: A08
    name: hook_drop_sync
    best_for: [saas, startup_hype]
    arc_step: hook
    emotion: [urgency, innovation]
    duration: [2.0, 4.0]
    energy: high
    camera_move: dolly_in
    color_scheme: innovation
    transition_in: hard_cut
    transition_out: zoom_through
    audio_cue: drop_point
    conversion_score: 9.5
    sequence:
      - step: beat_hold
        duration: 0.5
      - step: headline_chars_stagger
        target: ".headline span"
        props: { yPercent: "120->0", scale: "1.18->1.0", autoAlpha: "0->1" }
        duration: 0.9
        stagger: chars
        ease: premium_out
      - step: lighting_apply
        target: ".scene-root"
        lighting: gradient_pulse
        offset: "-=0.5"

  - id: A09
    name: split_screen_conflict
    best_for: [startup_hype, saas]
    arc_step: hook
    emotion: [urgency]
    duration: [2.0, 4.0]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: directional_wipe
    transition_out: hard_cut
    conversion_score: 8.4
    sequence:
      - step: left_panel_in
        target: ".panel-left"
        props: { x: "-100%->0%" }
        duration: 0.6
        ease: premium_out
      - step: right_panel_in
        target: ".panel-right"
        props: { x: "100%->0%" }
        duration: 0.6
        ease: premium_out
        offset: "<"
      - step: dwell
        duration: 1.5

  - id: A10
    name: countdown_blast
    best_for: [startup_hype]
    arc_step: hook
    emotion: [urgency]
    duration: [3.0, 5.0]
    energy: high
    camera_move: null
    color_scheme: urgency
    transition_in: hard_cut
    transition_out: scale_punch
    conversion_score: 8.6
    sequence:
      - step: count_3
        target: ".count-3"
        props: { scale: "1.2->1.0", autoAlpha: "0->1->0" }
        duration: 0.9
        ease: premium_out
      - step: count_2
        target: ".count-2"
        props: { scale: "1.2->1.0", autoAlpha: "0->1->0" }
        duration: 0.9
        ease: premium_out
      - step: count_1
        target: ".count-1"
        props: { scale: "1.2->1.0", autoAlpha: "0->1->0" }
        duration: 0.9
        ease: premium_out
      - step: blast
        target: ".blast-element"
        props: { scale: "0.8->1.18->1.0", autoAlpha: "0->1" }
        duration: 0.5
        ease: bounce_snap

  - id: A11
    name: kinetic_typo_burst
    best_for: [startup_hype, saas]
    arc_step: hook
    emotion: [urgency, innovation]
    duration: [2.0, 3.5]
    energy: high
    camera_move: null
