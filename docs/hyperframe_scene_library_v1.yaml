    transition_in: hard_cut
    transition_out: blur_dissolve
    conversion_score: 9.0
    sequence:
      - step: chars_burst
        target: ".typo-burst span"
        props: { y: "random(-60,60)", x: "random(-40,40)", autoAlpha: "0->1->1" }
        duration: 0.5
        stagger: chars
        ease: premium_out
      - step: chars_settle
        target: ".typo-burst span"
        props: { y: "0", x: "0" }
        duration: 0.8
        stagger: 0.008
        ease: premium_out
        offset: "-=0.3"

  - id: A12
    name: glitch_attention
    best_for: [startup_hype, innovation]
    arc_step: hook
    emotion: [urgency, innovation]
    duration: [1.5, 3.0]
