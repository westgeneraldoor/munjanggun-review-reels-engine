    sequence:
      - step: glitch_shake
        target: ".glitch-element"
        props: { x: "random(-8,8)", skewX: "random(-3,3)" }
        duration: 0.05
        repeat: 6
        ease: none
      - step: settle
        target: ".glitch-element"
        props: { x: "0", skewX: "0", autoAlpha: 1 }
        duration: 0.3
        ease: premium_out

